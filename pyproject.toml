[project]
name = "ope-to-decision"
version = "0.1.0"
description = "From logged bandit feedback to deployment decisions — multi-action OPE benchmark + deployment-gate playbook: which off-policy estimate can you trust, and when should you fall back to an A/B test?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "taehyun" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # notebook 층(M7): py:percent 저작 → jupytext 변환 → 실행 커밋
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
