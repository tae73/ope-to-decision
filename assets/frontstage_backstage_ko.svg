<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="본편(frontstage)과 백스테이지(backstage) 구조도: 로그만으로 계산하는 본편 신호를 참값 보유 백스테이지가 blind-then-reveal 로 채점하고, 관측 동등성 경계가 전 판정에 걸린다">
  <title>본편/백스테이지 구조도 — GT-미상 프로토콜의 두 무대 (M9)</title>
  <!-- assets/frontstage_backstage_en.svg 의 KO twin — 구조·좌표·팔레트·화살표 동일, 텍스트만 한국어.
       Inline presentation attributes only (no style/filter/marker elements) for GitHub camo-safe rendering.
       Palette = experiments/_style.py (entity-fixed figure colors); 경고 밴드는 decision_gate_flowchart 의
       #fdf3f7 tint / #e87ba4 stroke / #c94f7c 제목, battery 상자는 #eda100 stroke / #a97400 제목 관례 계승.
       수치 없음(구조도 — LEDGER 무관). 무대 언어 정본: docs/GLOSSARY.md §8. -->
  <rect x="0" y="0" width="1000" height="690" fill="#fcfcfb"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#33322e">본편과 백스테이지 &#8212; GT-미상 프로토콜의 두 무대</text>
    <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#55544e">실무자는 왼쪽만 가진다 &#183; 왼쪽을 믿을 근거는 오른쪽이 만든다 (GLOSSARY &#167;8)</text>

    <!-- 본편 (frontstage) -->
    <rect x="25" y="80" width="560" height="490" rx="10" fill="#ffffff" stroke="#008300" stroke-width="2"/>
    <text x="45" y="108" font-size="13.5" font-weight="bold" fill="#008300">본편 (frontstage) &#8212; 로그만으로, 참값 불필요</text>
    <text x="45" y="126" font-size="10.8" fill="#55544e">이 상자 안의 모든 계산은 로그 층과 후보 정책 분포만 입력받는다</text>

    <rect x="45" y="142" width="520" height="62" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="60" y="163" font-size="12" font-weight="bold" fill="#2a78d6">로그 층 (실무자의 자산 전부)</text>
    <text x="60" y="180" font-size="10.8" fill="#55544e">(x, a, r, 기록 pscore) + 후보 &#960;&#8337; 분포 &#8212; 참값 V(&#960;&#8337;) 는 아무도 모른다</text>
    <text x="60" y="195" font-size="10.8" fill="#55544e">(선택) 로그 유래 q&#770; &#183; 배포한 로깅 분포 &#183; 타임스탬프</text>

    <line x1="305" y1="204" x2="305" y2="234" stroke="#6f6e66" stroke-width="1.6"/>
    <polygon points="305,240 300,230 310,230" fill="#6f6e66"/>

    <rect x="45" y="244" width="160" height="146" rx="8" fill="#ffffff" stroke="#555550" stroke-width="1.6"/>
    <text x="58" y="266" font-size="12" font-weight="bold" fill="#33322e">게이트 v1</text>
    <text x="58" y="284" font-size="10.3" fill="#55544e">ESS/n &#183; max weight</text>
    <text x="58" y="298" font-size="10.3" fill="#55544e">support proxy</text>
    <text x="58" y="316" font-size="9.5" fill="#8a897f">임계 M1 사전등록</text>
    <text x="58" y="330" font-size="9.5" fill="#8a897f">평가만 &#183; 무튜닝</text>

    <rect x="215" y="244" width="185" height="146" rx="8" fill="#ffffff" stroke="#eda100" stroke-width="1.6"/>
    <text x="228" y="266" font-size="12" font-weight="bold" fill="#a97400">validity battery [제안]</text>
    <text x="228" y="284" font-size="10.3" fill="#55544e">E[w]=1 &#183; harmonic T(a*)</text>
    <text x="228" y="298" font-size="10.3" fill="#55544e">placebo(참값 0) &#183; disagreement</text>
    <text x="228" y="316" font-size="9.5" fill="#8a897f">필요조건 검사(falsifier)</text>
    <text x="228" y="330" font-size="9.5" fill="#8a897f">통과 &#8800; 무결의 증명</text>
    <text x="228" y="344" font-size="9.5" fill="#8a897f">임계 M8 사전등록 &#183; 무튜닝</text>

    <rect x="410" y="244" width="155" height="146" rx="8" fill="#ffffff" stroke="#e87ba4" stroke-width="1.6"/>
    <text x="423" y="266" font-size="12" font-weight="bold" fill="#c94f7c">&#923;*_flip</text>
    <text x="423" y="284" font-size="10.3" fill="#55544e">결론이 뒤집히는</text>
    <text x="423" y="298" font-size="10.3" fill="#55544e">최소 감도 &#923;</text>
    <text x="423" y="316" font-size="9.5" fill="#8a897f">인증서 아님 &#8212;</text>
    <text x="423" y="330" font-size="9.5" fill="#8a897f">취약성 보고서</text>

    <line x1="305" y1="390" x2="305" y2="420" stroke="#6f6e66" stroke-width="1.6"/>
    <polygon points="305,426 300,416 310,416" fill="#6f6e66"/>

    <rect x="45" y="430" width="520" height="74" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.6"/>
    <text x="60" y="451" font-size="12" font-weight="bold" fill="#4a3aa7">결합 규칙(사전등록) &#8594; 판정 &#183; 결정</text>
    <text x="60" y="468" font-size="10.3" fill="#55544e">harmonic fail &#8594; AB-FALLBACK &#183; E[w]/placebo/disagreement fail &#8594; DISTRUST &#183; 그 외 gate v1</text>
    <text x="60" y="483" font-size="10.3" fill="#55544e">결정: SNIPS CI vs mean(r) &#8594; GO / NO-GO / A/B &#183; fragile 라벨(&#923;*_flip 소형)</text>
    <text x="60" y="498" font-size="9.5" fill="#8a897f">frontstage 산출 CSV 에는 참값 컬럼이 존재하지 않는다(계약 테스트)</text>

    <text x="45" y="530" font-size="9.5" font-style="italic" fill="#8a897f">본편 축: 12 &#183; 14 &#183; 17&#8211;21 &#8212; 실전(축 20)에는 채점표(reveal) 자체가 존재하지 않는다.</text>
    <text x="45" y="546" font-size="9.5" font-style="italic" fill="#8a897f">"모른다"(inconclusive &#183; A/B 유예)는 실패가 아니라 프로토콜의 정당한 출력이다.</text>

    <!-- reveal 연결 -->
    <line x1="585" y1="330" x2="642" y2="330" stroke="#b3b2a9" stroke-width="1.6" stroke-dasharray="6 4"/>
    <polygon points="648,330 638,325 638,335" fill="#b3b2a9"/>
    <text x="616" y="318" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6f6e66">blind-then-</text>
    <text x="616" y="348" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6f6e66">reveal</text>

    <!-- 백스테이지 (backstage) -->
    <rect x="650" y="80" width="325" height="420" rx="10" fill="#ffffff" stroke="#555550" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="668" y="108" font-size="13.5" font-weight="bold" fill="#33322e">백스테이지 (backstage)</text>
    <text x="668" y="126" font-size="10.8" fill="#55544e">참값 보유 채점 &#8212; 채점 전용 oracle 층</text>

    <rect x="668" y="142" width="289" height="58" rx="8" fill="#ffffff" stroke="#b3b2a9" stroke-width="1.4"/>
    <text x="681" y="162" font-size="11" font-weight="bold" fill="#33322e">합성 DGP &#8212; 정확 참값 v_true</text>
    <text x="681" y="178" font-size="9.5" fill="#8a897f">축 01&#8211;10 &#183; 15&#8211;16 + 축 17&#8211;19 의 reveal 채점</text>

    <rect x="668" y="212" width="289" height="58" rx="8" fill="#ffffff" stroke="#b3b2a9" stroke-width="1.4"/>
    <text x="681" y="232" font-size="11" font-weight="bold" fill="#33322e">c2b &#8212; 전 라벨 정확 참값</text>
    <text x="681" y="248" font-size="9.5" fill="#8a897f">축 11 + 축 21 replication 의 reveal 채점</text>

    <rect x="668" y="282" width="289" height="58" rx="8" fill="#ffffff" stroke="#b3b2a9" stroke-width="1.4"/>
    <text x="681" y="302" font-size="11" font-weight="bold" fill="#33322e">OBD &#8212; 근사 참값 (bootstrap CI 병기)</text>
    <text x="681" y="318" font-size="9.5" fill="#8a897f">축 12 &#8212; 구간 언어만 &#183; 점 비교 단정 금지</text>

    <text x="668" y="368" font-size="10.8" fill="#55544e">여기서 실측한 것: 게이트&#183;battery 의 예보력,</text>
    <text x="668" y="384" font-size="10.8" fill="#55544e">결정 가치(naive 대비), 그리고 맹점의 경계.</text>
    <text x="668" y="412" font-size="9.5" font-style="italic" fill="#8a897f">백스테이지는 실무에 존재하지 않는다 &#8212;</text>
    <text x="668" y="428" font-size="9.5" font-style="italic" fill="#8a897f">본편 신호를 믿을 근거를 만드는 무대다.</text>
    <text x="668" y="456" font-size="9.5" font-style="italic" fill="#8a897f">GT-known 세계는 여기로 내려왔다 &#8212;</text>
    <text x="668" y="472" font-size="9.5" font-style="italic" fill="#8a897f">동기이자 검증 층으로 (M8 재정위).</text>

    <!-- 관측 동등성 경계 밴드 -->
    <rect x="25" y="585" width="950" height="85" rx="10" fill="#fdf3f7" stroke="#e87ba4" stroke-width="1.6"/>
    <text x="45" y="610" font-size="12" font-weight="bold" fill="#c94f7c">관측 동등성 경계 (축 18) &#8212; 두 무대를 가르는 선</text>
    <text x="45" y="628" font-size="10.3" fill="#55544e">기록 pscore 가 참 marginal 인 confounding 은 어떤 로그 통계로도 구별할 수 없다 &#8212; battery 전항이 침묵한 채 bias 만 자란다.</text>
    <text x="45" y="643" font-size="10.3" fill="#55544e">battery 는 blind spot 을 줄이지만 없애지 못한다. 정직한 출구는 점추정이 아니라 &#923;-감도 구간의 폭과 abstention 이다.</text>
    <text x="45" y="660" font-size="9.5" font-style="italic" fill="#8a897f">battery = 필요조건 검사 &#8212; 이 경고는 본편의 모든 "통과" 판정에 붙는 면책이다 (CLAUDE.md &#167;5 co-exhibit).</text>
  </g>
</svg>
